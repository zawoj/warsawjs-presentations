  </defs>
  <rect width="1200" height="720" fill="#11161a"/>
  <rect width="1200" height="720" fill="url(#grid)"/>
  <rect x="42" y="42" width="1116" height="636" fill="none" stroke="#7d8990"/>
  <rect x="42" y="42" width="6" height="636" fill="#2962ff"/>
  <text x="84" y="104" fill="#7fa0ff" font-family="monospace" font-size="20">EARLY LOOK / WORK IN PROGRESS</text>
