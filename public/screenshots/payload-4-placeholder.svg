  <text x="84" y="420" fill="#f3f5f6" font-family="Arial, sans-serif" font-size="72" font-weight="800">SCREENSHOT</text>
  <text x="84" y="604" fill="#91a0a8" font-family="monospace" font-size="19">PLACEHOLDER / REPLACE WITH PAYLOAD ASSET</text>
</svg>
