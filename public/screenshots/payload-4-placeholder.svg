  <desc id="desc">Grid placeholder for an official Payload 4.0 preview screenshot.</desc>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#354149" stroke-opacity=".2" stroke-width="1"/>
